name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: build & test (macOS)
    # macos-latest：公开仓库免费额度里最稳的标签，arm64/x86 都由 GitHub 分配
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift 版本
        run: swift --version

      - name: 构建
        run: swift build -v

      - name: 单元测试
        run: swift test

      - name: 打包 .app 冒烟
        run: |
          ./scripts/bundle.sh
          test -x build/Handy.app/Contents/MacOS/Handy
          test -x build/Handy.app/Contents/Resources/bin/handy-transcribe
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/Handy.app/Contents/Info.plist

      - name: CLI 冒烟（--help 不崩）
        run: ./handy-transcribe --help | head -3
